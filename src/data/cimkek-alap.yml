# Kezdő címkekészlet, hogy a beküldő-form autocomplete-je ne legyen üres
# az első napon. Egyszintű, lapos lista — nincs kategória-mező a rendszerben,
# a csoportosítás itt csak az áttekinthetőség kedvéért van.
#
# A címkék HANGULATOT neveznek meg, nem tényt: nem az számít, hogy a pad fából
# vagy fémből van, hanem hogy mit érez, aki ráül. Soha nem elutasítóak — minden
# padot szeretünk —, és főnévi alakban állnak.
# Bővíthető: új sor = új alapcímke. (lásd TERV.md 9. fejezet)

