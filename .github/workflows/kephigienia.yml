name: Kép- és tartalom-higiénia

on:
  schedule:
    - cron: "0 6 * * 1" # minden hétfőn 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  figyelmeztetesek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Tartalom-ellenőrzés (nem blokkoló — csak jelez)
        id: lint
        run: |
          npm run lint:content:info > lint-eredmeny.txt 2>&1 || true
          cat lint-eredmeny.txt
          if grep -qE "HIBA|FIGYELEM" lint-eredmeny.txt; then
            echo "van_jelzes=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Issue nyitása, ha van mit jelezni
        if: steps.lint.outputs.van_jelzes == '1'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const eredmeny = fs.readFileSync('lint-eredmeny.txt', 'utf-8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Heti kép-/tartalom-higiénia (${new Date().toISOString().slice(0, 10)})`,
              body: "```\n" + eredmeny + "\n```",
              labels: ["higiénia"],
            });
